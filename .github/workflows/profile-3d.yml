name: GitHub 3D Contrib Skyline

on:
  schedule:
    # 13:00 UTC = 11:00 PM AEST / 12:00 AM AEDT (Sydney Time)
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contrib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate 3D Contribution Graph
        run: npm run dev -- ${GITHUB_REPOSITORY_OWNER}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f profile-3d-contrib/
          if git commit -m "chore: update 3d contribution skyline [skip ci]"; then
            git push
          fi
